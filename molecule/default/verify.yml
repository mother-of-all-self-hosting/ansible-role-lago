---
- name: Verify Lago
  hosts: all
  become: true
  gather_facts: false

  vars:
    lago_verify_api_url: "http://127.0.0.1:{{ lago_api_container_http_host_bind_port }}"
    lago_verify_front_url: "http://127.0.0.1:{{ lago_front_container_http_host_bind_port }}"
    lago_verify_pdf_url: "http://127.0.0.1:{{ lago_pdf_container_http_host_bind_port }}"

    # Sidekiq's liveness server, published out of the API container.
    lago_verify_worker_url: "http://127.0.0.1:8080/"

    # The name carries both the role and the scenario, like the platform does,
    # so a leftover container can never be mistaken for another scenario's.
    lago_verify_control_container: "{{ inventory_hostname }}-negative-control"

    lago_verify_units:
      - lago-api.service
      - lago-api-worker.service
      - lago-api-clock.service
      - lago-front.service
      - lago-pdf.service

    lago_verify_psql: >-
      docker exec {{ lago_molecule_postgres_container }}
      psql -U {{ lago_molecule_postgres_superuser }} -d {{ lago_database_name }} -tAc

  tasks:
    # The role is not included in this playbook, so its defaults are not in
    # scope. Reading defaults/main.yml directly ties the version assertion
    # below.
    - name: Load the role defaults
      ansible.builtin.include_vars:
        file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
        name: lago_defaults

    - name: Read the Lago containers the role created
      ansible.builtin.command:
        cmd: >-
          docker inspect
          {{ lago_molecule_api_container }}
          {{ lago_molecule_front_container }}
          {{ lago_molecule_pdf_container }}
      register: lago_containers_raw
      changed_when: false

    - name: Make sense of the Lago containers
      ansible.builtin.set_fact:
        lago_containers: >-
          {{
            dict(
              lago_containers_raw.stdout | from_json
              | map(attribute='Name') | map('regex_replace', '^/', '')
              | zip(lago_containers_raw.stdout | from_json)
            )
          }}

    # ------------------------------------------------------------------
    # The negative control: the same image, without the role's doing
    # ------------------------------------------------------------------

    # Everything asserted below is only evidence about the role if the stock
    # image cannot produce it unaided. It cannot: the API image needs an RSA
    # key, a database URL and a Redis URL that only the role writes, and
    # without them it does not survive its own startup.
    - name: Run the Lago API image with none of the role's configuration
      ansible.builtin.command:
        cmd: >-
          timeout 300
          docker run --rm --name {{ lago_verify_control_container }}
          {{ lago_containers[lago_molecule_api_container].Config.Image }}
      register: lago_control
      changed_when: true
      failed_when: false

    - name: Assert the Lago API image cannot start without the role's configuration
      ansible.builtin.assert:
        # 0 would mean it ran to completion, 124 that `timeout` had to stop a
        # container which was happily running. Either would make everything
        # below unattributable to the role.
        that: lago_control.rc not in [0, 124]
        fail_msg: >-
          The unconfigured Lago API image exited with {{ lago_control.rc }}, so
          nothing below can be credited to the role
        success_msg: >-
          The unconfigured Lago API image dies on startup (rc={{ lago_control.rc }}),
          so a Lago that serves anything at all is the role's doing

    # ------------------------------------------------------------------
    # The units are up
    # ------------------------------------------------------------------

    - name: Wait for the Lago systemd services to become active (up to 180s each)
      ansible.builtin.systemd_service:
        name: "{{ item }}"
      register: lago_services
      until: lago_services.status.ActiveState == 'active'
      retries: 36
      delay: 5
      loop: "{{ lago_verify_units }}"

    - name: Assert the Lago systemd services are active
      ansible.builtin.assert:
        that: lago_services.results | map(attribute='status.ActiveState') | unique | list == ['active']
        fail_msg: >-
          Not every Lago service is active:
          {{ dict(lago_verify_units | zip(lago_services.results | map(attribute='status.ActiveState'))) }}
        success_msg: "All five Lago systemd services are active"

    - name: Retrieve the Lago service logs for debugging
      when: lago_debug_service_enabled | bool
      ansible.builtin.command:
        cmd: "journalctl -xeu {{ item }}"
      changed_when: false
      loop: "{{ lago_verify_units }}"

    # ------------------------------------------------------------------
    # The PDF renderer is not merely listening, it has its engines up
    # ------------------------------------------------------------------

    - name: Wait for the Lago PDF service to report itself up (up to 3m)
      ansible.builtin.uri:
        url: "{{ lago_verify_pdf_url }}/health"
        status_code: [200, 503]
      register: lago_pdf_health
      until: lago_pdf_health.status == 200
      retries: 36
      delay: 5

    - name: Assert the Lago PDF service has both of its rendering engines up
      ansible.builtin.assert:
        that:
          - lago_pdf_health.json.status == 'up'
          - lago_pdf_health.json.details.chromium.status == 'up'
          - lago_pdf_health.json.details.libreoffice.status == 'up'
        fail_msg: "The Lago PDF service is not fully up: {{ lago_pdf_health.json }}"
        success_msg: "The Lago PDF service has Chromium and LibreOffice up, so it can render invoices"

    # ------------------------------------------------------------------
    # The migrations ran, which /health alone does not tell you
    # ------------------------------------------------------------------

    # The API image's entrypoint runs `rails db:migrate` and then starts the
    # server whether or not that succeeded, and /health only issues an empty
    # statement on the connection - it answers 200 "Success" against a database
    # with no tables in it at all. The schema therefore has to be asked directly.
    - name: Wait for Lago to migrate its database (up to 8m)
      ansible.builtin.command:
        cmd: "{{ lago_verify_psql }} \"select count(*) from schema_migrations\""
      register: lago_migrations
      changed_when: false
      failed_when: false
      until: lago_migrations.rc == 0 and (lago_migrations.stdout | trim | int) > 0
      retries: 96
      delay: 5

    - name: Read the Lago billing tables out of the database
      ansible.builtin.command:
        cmd: >-
          {{ lago_verify_psql }}
          "select to_regclass('public.customers') is not null
           and to_regclass('public.invoices') is not null
           and to_regclass('public.subscriptions') is not null"
      register: lago_billing_tables
      changed_when: false

    - name: Assert Lago migrated its database and has a billing schema
      ansible.builtin.assert:
        that:
          - (lago_migrations.stdout | trim | int) > 0
          - lago_billing_tables.stdout | trim == 't'
        fail_msg: >-
          Lago did not migrate: {{ lago_migrations.stdout | trim | int }} migrations recorded,
          billing tables present={{ lago_billing_tables.stdout | trim }}.
          A failing `rails db:migrate` does not stop the API from starting, so check
          `journalctl -u lago-api.service` for the migration error itself.
        success_msg: >-
          Lago recorded {{ lago_migrations.stdout | trim }} migrations and has its
          customers, invoices and subscriptions tables

    # ------------------------------------------------------------------
    # The API answers, and names the version this role pins
    # ------------------------------------------------------------------

    - name: Wait for the Lago API to answer (up to 5m)
      ansible.builtin.uri:
        url: "{{ lago_verify_api_url }}/health"
        status_code: [200, 500, 502, 503]
      register: lago_api_health
      until: lago_api_health.status == 200
      retries: 60
      delay: 5

    # /health reports the contents of the image's LAGO_VERSION file, which is the
    # release tag. Comparing it with the leaf variable Renovate bumps is what ties
    # the process that is actually running to the version the role claims to pin.
    - name: Assert the running Lago API is healthy and is the version this role installs
      ansible.builtin.assert:
        that:
          - lago_api_health.json.message == 'Success'
          - lago_api_health.json.version == lago_defaults.lago_version
        fail_msg: >-
          The Lago API reported {{ lago_api_health.json }}, expected
          version {{ lago_defaults.lago_version }} and message "Success"
        success_msg: >-
          The running Lago API reports itself as {{ lago_api_health.json.version }},
          which is what `lago_version` pins

    # ------------------------------------------------------------------
    # The worker is running, and is not merely a unit that reads `active`
    # ------------------------------------------------------------------

    # `lago-api-worker.service` runs Sidekiq through `docker exec` into the API
    # container, so systemd watches a docker client, not the worker. Sidekiq
    # itself opens this server on startup and answers it only after
    # `Sidekiq.redis.ping` comes back PONG - so a 200 here means the worker
    # process exists and has a working connection to the Valkey the role wired up.
    - name: Wait for the Lago worker to report itself live (up to 5m)
      ansible.builtin.uri:
        url: "{{ lago_verify_worker_url }}"
        return_content: true
        status_code: [200, 404]
      register: lago_worker_live
      until: lago_worker_live.status == 200
      retries: 60
      delay: 5

    - name: Assert the Lago worker is live and talking to its data-store
      ansible.builtin.assert:
        that:
          - lago_worker_live.status == 200
          - "'Live!' in lago_worker_live.content"
        fail_msg: >-
          Sidekiq did not report itself live ({{ lago_worker_live.status }}):
          {{ lago_worker_live.content | default('') | truncate(200) }}
        success_msg: "The Lago worker is live and its Valkey connection answers PONG"

    # ------------------------------------------------------------------
    # Configuration reaches the processes, not just the files on disk
    # ------------------------------------------------------------------

    # `lago_api_environment_variable_lago_sidekiq_web` is the only thing that
    # mounts this route: Lago's routes.rb consults the environment variable at
    # boot. Anything other than a 404 therefore proves the leaf variable travelled
    # through the rendered env file into the running Rails process' route table.
    - name: Ask the Lago API for the Sidekiq web interface
      ansible.builtin.uri:
        url: "{{ lago_verify_api_url }}/sidekiq"
        follow_redirects: none
        status_code: [200, 301, 302, 404]
      register: lago_sidekiq_web

    - name: Assert the Lago API mounted the Sidekiq web interface
      ansible.builtin.assert:
        that: lago_sidekiq_web.status in [200, 301, 302]
        fail_msg: >-
          /sidekiq answered {{ lago_sidekiq_web.status }}, so
          `lago_api_environment_variable_lago_sidekiq_web` did not reach the running API
        success_msg: >-
          /sidekiq answers {{ lago_sidekiq_web.status }}, so
          `lago_api_environment_variable_lago_sidekiq_web` reached the running API

    # The frontend is a static bundle; everything it knows about this deployment
    # is substituted into this file when the container starts. It is where a
    # browser learns which API to talk to, so it is the honest place to check
    # that the role's frontend configuration arrived.
    - name: Retrieve the Lago frontend runtime configuration
      ansible.builtin.uri:
        url: "{{ lago_verify_front_url }}/env-config.js"
        return_content: true
        status_code: [200]
      register: lago_front_env_config

    - name: Assert the Lago frontend points at the API URL the role configured
      ansible.builtin.assert:
        that: >-
          'window.API_URL = "' ~ lago_api_environment_variable_lago_api_url ~ '"'
          in lago_front_env_config.content
        fail_msg: >-
          The Lago frontend was not told about {{ lago_api_environment_variable_lago_api_url }}:
          {{ lago_front_env_config.content | truncate(300) }}
        success_msg: >-
          The Lago frontend tells browsers to use {{ lago_api_environment_variable_lago_api_url }}

    - name: Retrieve the Lago frontend landing page
      ansible.builtin.uri:
        url: "{{ lago_verify_front_url }}/"
        return_content: true
        status_code: [200]
      register: lago_front_page

    - name: Assert the Lago frontend serves its application shell
      ansible.builtin.assert:
        that:
          - "'<title>Lago</title>' in lago_front_page.content"
          - "'env-config.js' in lago_front_page.content"
        fail_msg: "The Lago frontend did not serve its application shell"
        success_msg: "The Lago frontend serves its application shell"

    # ------------------------------------------------------------------
    # Every container runs the version its leaf variable names
    # ------------------------------------------------------------------

    # The API names its own version above. The frontend and the PDF renderer do
    # not report a version that corresponds to their tag - the Gotenberg fork
    # answers /version with its Gotenberg version (8.23.1), not with its image
    # tag - so the running containers are asked what they were started from.
    - name: Assert the Lago containers run the versions the role pins
      ansible.builtin.assert:
        that:
          - lago_containers[lago_molecule_api_container].Config.Image | split(':') | last == lago_defaults.lago_version
          - lago_containers[lago_molecule_front_container].Config.Image | split(':') | last == lago_defaults.lago_version
          - lago_containers[lago_molecule_pdf_container].Config.Image | split(':') | last == lago_defaults.lago_gotenberg_version | string
        fail_msg: >-
          The running containers do not match the pinned versions
          (lago_version={{ lago_defaults.lago_version }},
          lago_gotenberg_version={{ lago_defaults.lago_gotenberg_version }}):
          {{ lago_containers.values() | map(attribute='Config.Image') | list }}
        success_msg: >-
          All three containers run what the role pins:
          {{ lago_containers.values() | map(attribute='Config.Image') | list }}

    # ------------------------------------------------------------------
    # Nothing was quietly restarting while all of that was being checked
    # ------------------------------------------------------------------

    # `Restart=always` means a unit reads `active` while it is crash-looping, and
    # a loop is exactly what a Lago that cannot reach Postgres or Valkey would
    # settle into. Restart counters from before this point say nothing, because
    # the worker and the clock legitimately restart a few times while they wait
    # for the API container to finish migrating - so the window starts here,
    # with everything already answering.
    - name: Sample the Lago restart counters
      ansible.builtin.systemd_service:
        name: "{{ item }}"
      register: lago_restarts_before
      loop: "{{ lago_verify_units }}"

    # Comfortably longer than the units' `RestartSec=30`, so a crash loop has to
    # tick at least once inside the window.
    - name: Watch the Lago services for 45 seconds
      ansible.builtin.pause:
        seconds: 45

    - name: Sample the Lago restart counters again
      ansible.builtin.systemd_service:
        name: "{{ item }}"
      register: lago_restarts_after
      loop: "{{ lago_verify_units }}"

    - name: Assert no Lago service restarted while it was up
      ansible.builtin.assert:
        that: >-
          lago_restarts_after.results | map(attribute='status.NRestarts') | list
          == lago_restarts_before.results | map(attribute='status.NRestarts') | list
        fail_msg: >-
          A Lago service restarted while it was supposedly up, so `active` was
          hiding a crash loop. Before:
          {{ dict(lago_verify_units | zip(lago_restarts_before.results | map(attribute='status.NRestarts'))) }},
          after:
          {{ dict(lago_verify_units | zip(lago_restarts_after.results | map(attribute='status.NRestarts'))) }}
        success_msg: >-
          No Lago service restarted over 45 seconds of watching (restarts so far:
          {{ dict(lago_verify_units | zip(lago_restarts_after.results | map(attribute='status.NRestarts'))) }})

    - name: Show the Lago verification summary
      ansible.builtin.debug:
        msg:
          - "systemd: {{ dict(lago_verify_units | zip(lago_services.results | map(attribute='status.ActiveState'))) }}"
          - "unconfigured image: exited rc={{ lago_control.rc }}"
          - "migrations: {{ lago_migrations.stdout | trim }} recorded, billing tables present={{ lago_billing_tables.stdout | trim }}"
          - "API: {{ lago_api_health.status }} {{ lago_api_health.json.message }}, version {{ lago_api_health.json.version }}"
          - "worker: {{ lago_worker_live.status }} {{ lago_worker_live.content | trim }}"
          - "sidekiq web: {{ lago_sidekiq_web.status }}"
          - "PDF: {{ lago_pdf_health.json.status }} (chromium and libreoffice up)"
          - "frontend: {{ lago_front_page.status }}, API URL {{ lago_api_environment_variable_lago_api_url }}"
          - "images: {{ lago_containers.values() | map(attribute='Config.Image') | list }}"
          - "restarts: {{ dict(lago_verify_units | zip(lago_restarts_after.results | map(attribute='status.NRestarts'))) }}"
