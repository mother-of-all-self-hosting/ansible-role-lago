---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: lago-${MOLECULE_DISTRO:-ubuntu2604}-default
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        lago_debug_service_enabled: false

        # Variables for Lago
        lago_uid: 1000
        lago_gid: 1000
        lago_scheme: http
        lago_hostname: localhost
        lago_container_labels_traefik_enabled: false
        lago_api_container_http_host_bind_port: 3000
        lago_front_container_http_host_bind_port: 80
        lago_architecture: amd64
        lago_api_environment_variable_lago_rsa_private_key: ""
        lago_api_environment_variable_lago_api_url: http://localhost:3000
        lago_api_environment_variable_lago_front_url: http://localhost:80
        lago_api_environment_variable_secret_key_base: random01d18ea0b43c1673987e194ef4b2d4978e0bf1e6abf83dd32892412b4b62faed17159293a92774017082e1a01c3fb2248af31174b6572a469adeeef730
        lago_api_environment_variable_encryption_primary_key: randomqPAceqj7zDRHgUw1iZHZVGgrH2jkkLIANAI6IYKC7tWa2flM1kfo4OQope
        lago_api_environment_variable_encryption_deterministic_key: randomqPAceqj7zDRHgUw1iZHZVGgrH2jkkLIANAI6IYKC7tWa2flM1kfo4OQope
        lago_api_environment_variable_encryption_key_derivation_salt: randomqPAceqj7zDRHgUw1iZHZVGgrH2jkkLIANAI6IYKC7tWa2flM1kfo4OQope

        # Variables required for Lago to connect to the Postgres database
        lago_database_hostname: "{{ postgres_connection_hostname }}"
        lago_database_port: "{{ postgres_connection_port }}"
        lago_database_username: my_database_username
        lago_database_password: my_database_password
        lago_database_name: lago
        lago_systemd_required_services_list_auto: |
          {{
            (['postgres.service'])
          }}

        # Variables required for Lago to connect to the Valkey data-store
        lago_redis_hostname: "{{ valkey_identifier }}"
        lago_api_container_additional_networks_custom:
          - "{{ valkey_container_network }}"
        lago_api_systemd_required_services_list_custom:
          - "{{ valkey_identifier }}.service"

        # Variables for Postgres
        postgres_uid: 1000
        postgres_gid: 1000
        postgres_connection_password: postgres_password
        postgres_container_network: "{{ lago_container_network }}"
        postgres_managed_databases: |
          {{
            [{
              'name': lago_database_name,
              'username': lago_database_username,
              'password': lago_database_password,
            }]
          }}

        # Variables for Valkey
        valkey_uid: 1000
        valkey_gid: 1000
        valkey_arch: amd64
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
scenario:
  # See: https://docs.ansible.com/projects/molecule/configuration/?h=test_sequence#scenario
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    # Disable idempotence test for now due to ansible-role-postgres
    # - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
verifier:
  name: ansible
