  {{ devture_systemd_docker_base_host_command_docker }} stop -t {{ lago_front_container_stop_grace_time_seconds }} {{ lago_front_identifier }} >/dev/null 2>&1 || true;
  {{ devture_systemd_docker_base_host_command_docker }} rm -f {{ lago_front_identifier }} >/dev/null 2>&1 || true;
  if {{ devture_systemd_docker_base_host_command_docker }} container inspect {{ lago_front_identifier }} >/dev/null 2>&1; then
  i=$((i + 1));
