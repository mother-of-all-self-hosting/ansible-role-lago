########################################################################

########################################################################
#                                                                      #
# api_clock                                                            #
#                                                                      #
########################################################################

lago_api_clock_identifier: "{{ lago_identifier }}-api-clock"

# List of systemd services that the Lago API clock systemd service depends on
lago_api_clock_systemd_required_services_list: "{{ lago_api_clock_systemd_required_services_list_default + lago_api_clock_systemd_required_services_list_auto + lago_api_clock_systemd_required_services_list_custom }}"
lago_api_clock_systemd_required_services_list_default: |
  {{
    ([devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [])
    +
    ([lago_api_identifier ~ '.service'])
  }}
lago_api_clock_systemd_required_services_list_auto: []
lago_api_clock_systemd_required_services_list_custom: []

# List of systemd services that the Lago API clock systemd service wants
lago_api_clock_systemd_wanted_services_list: "{{ lago_api_clock_systemd_wanted_services_list_default + lago_api_clock_systemd_wanted_services_list_auto + lago_api_clock_systemd_wanted_services_list_custom }}"
lago_api_clock_systemd_wanted_services_list_default: []
lago_api_clock_systemd_wanted_services_list_auto: []
lago_api_clock_systemd_wanted_services_list_custom: []

########################################################################
#                                                                      #
# /api_clock                                                           #
#                                                                      #
########################################################################

########################################################################
#                                                                      #
# api_worker                                                           #
#                                                                      #
########################################################################

lago_api_worker_identifier: "{{ lago_identifier }}-api-worker"

# List of systemd services that the Lago API worker systemd service depends on
lago_api_worker_systemd_required_services_list: "{{ lago_api_worker_systemd_required_services_list_default + lago_api_worker_systemd_required_services_list_auto + lago_api_worker_systemd_required_services_list_custom }}"
lago_api_worker_systemd_required_services_list_default: |
  {{
    ([devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [])
    +
    ([lago_api_identifier ~ '.service'])
  }}
lago_api_worker_systemd_required_services_list_auto: []
lago_api_worker_systemd_required_services_list_custom: []

# List of systemd services that the Lago API worker systemd service wants
lago_api_worker_systemd_wanted_services_list: "{{ lago_api_worker_systemd_wanted_services_list_default + lago_api_worker_systemd_wanted_services_list_auto + lago_api_worker_systemd_wanted_services_list_custom }}"
lago_api_worker_systemd_wanted_services_list_default: []
lago_api_worker_systemd_wanted_services_list_auto: []
lago_api_worker_systemd_wanted_services_list_custom: []

