  continue;
  fi;
  if {{ devture_systemd_docker_base_host_command_docker }} info >/dev/null 2>&1; then
  exit 0;
  fi;
  echo "Failed to query Docker daemon while cleaning up {{ lago_front_identifier }}" >&2;
  exit 1;
  done;
  echo "Failed to remove stale container {{ lago_front_identifier }} after {{ lago_front_container_cleanup_timeout_seconds }} attempts" >&2;
  exit 1

